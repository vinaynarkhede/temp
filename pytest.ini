[pytest]
# Pytest configuration for Distributed Compute Marketplace

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Asyncio configuration
asyncio_mode = auto

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show test durations
    --durations=10
    # Strict markers (only registered markers allowed)
    --strict-markers
    # Show warnings
    -W default
    # Coverage options
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    # Minimum coverage percentage (85% as per CLAUDE.md)
    --cov-fail-under=85
    # Disable coverage for test files
    --cov-config=.coveragerc

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require external services)
    slow: Slow tests (skip by default)
    api: API endpoint tests
    database: Database tests
    security: Security-related tests

# Ignore directories
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    venv
    __pycache__
    htmlcov
    .pytest_cache

# Logging configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Console output format
console_output_style = progress

# Timeout for tests (seconds)
# Uncomment when pytest-timeout is installed
# timeout = 300
# timeout_method = thread
